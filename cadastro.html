<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de cadastro</title>
    <link rel="stylesheet" href="stylecadastro.css">
</head>
<body>
    <main class="container-cadastro">
        <form id="formularioCadastro">
            
            <!-- TELA 1: FORMULÁRIO -->
            <div id="secao-formulario">
                <h2>Cadastro do Morador</h2>

                <div class="input-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" required>
                </div>

                <!-- Agrupamento lado a lado para economizar espaço vertical -->
                <div class="form-row">
                    <div class="input-group">
                        <label for="cpf">CPF:</label>
                        <input type="text" id="cpf" name="cpf" maxlength="14" placeholder="000.000.000-00" required>
                    </div>

                    <div class="input-group">
                        <label for="ano">Ano de Nascimento:</label>
                        <input type="number" id="ano" name="ano" min="1900" max="2026" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <fieldset class="input-group fieldset-genero">
                    <legend>Gênero</legend>
                    <div class="radio-group">
                        <label class="radio-item" for="masc">
                            <input type="radio" name="radgen" id="masc" value="Masculino">
                            <span>Masculino</span>
                        </label>
                        
                        <label class="radio-item" for="fem">
                            <input type="radio" name="radgen" id="fem" value="Feminino">
                            <span>Feminino</span>
                        </label>
                        
                        <label class="radio-item" for="nd">
                            <input type="radio" name="radgen" id="nd" value="nao_declarado" required>
                            <span>Prefiro não declarar</span>
                        </label>
                    </div>
                </fieldset>

                <div class="form-row">
                    <div class="input-group">
                        <label for="senha">Senha (mín. 8 caracteres):</label>
                        <div class="password-wrapper">
                            <input type="password" id="senha" name="senha" minlength="8" maxlength="72" required>
                            <button type="button" class="toggle-password" onclick="alternarVisibilidade('senha', this)" aria-label="Mostrar senha">👁️</button>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="confirmaSenha">Confirme a Senha:</label>
                        <div class="password-wrapper">
                            <input type="password" id="confirmaSenha" name="confirmaSenha" minlength="8" maxlength="72" required>
                            <button type="button" class="toggle-password" onclick="alternarVisibilidade('confirmaSenha', this)" aria-label="Mostrar senha">👁️</button>
                        </div>
                    </div>
                </div>

                <button type="button" id="btnValidar" class="btn-principal">
                    Validar Dados
                </button>
            </div>

            <!-- TELA 2: CONFIRMAÇÃO DE DADOS (Inicia oculta) -->
            <div id="secao-confirmacao" style="display: none;">
                <h2>Confirme seus Dados</h2>
                <div id="resumo-dados"></div>
                <div class="botoes-confirmacao">
                    <button type="button" class="btn-secundario" onclick="corrigirCadastro()">Refazer Cadastro</button>
                    <button type="button" class="btn-principal" onclick="confirmarCadastroFinal()">Confirmar Cadastro</button>
                </div>
            </div>

        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="scriptcadastro.js"></script>
</body>
</html>
